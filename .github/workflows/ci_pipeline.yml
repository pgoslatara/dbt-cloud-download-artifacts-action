---
name: CI pipeline

# Runs the PR's code, including from forks, so this workflow gets no secrets and a
# read-only token. The dbt Cloud integration test lives in integration_pipeline.yml.
on:
  pull_request:
      branches:
          - main

permissions:
    contents: read

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                fetch-depth: "0"
                persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

            - name: Set up Python
              run: uv python install

            - name: Install dependencies
              run: make install

            # Tool or dependency bumps (e.g. Dependabot) only touch config files, so
            # linting changed files alone would skip every Python hook.
            - name: Run pre-commit
              run: |
                git diff --name-only --diff-filter=d origin/main...HEAD > changed_files.txt
                cat changed_files.txt
                if grep -qxE '\.pre-commit-config\.yaml|pyproject\.toml|uv\.lock' changed_files.txt; then
                  uv run pre-commit run --all-files
                else
                  cat changed_files.txt | xargs --no-run-if-empty uv run pre-commit run --files
                fi

    unit-tests:
      needs: [pre-commit]
      runs-on: ubuntu-latest
      permissions:
          contents: read
          pull-requests: write
      steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              persist-credentials: false

          - name: Install uv
            uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

          - name: Set up Python
            run: uv python install

          - name: Install dependencies
            run: make install

          - name: Run pytest (unit tests)
            run: make test | tee pytest-coverage.txt && exit ${PIPESTATUS[0]}

          # Fork PRs get a read-only token, so they cannot post the comment.
          - name: Pytest coverage comment
            if: github.event.pull_request.head.repo.full_name == github.repository
            uses: MishaKav/pytest-coverage-comment@9ee59af31bd7bcada1cc496f086b407122602dbd # v1.12.3
            with:
                pytest-coverage-path: ./pytest-coverage.txt
                title: Coverage Report
                badge-title: Coverage
                junitxml-path: ./coverage.xml
