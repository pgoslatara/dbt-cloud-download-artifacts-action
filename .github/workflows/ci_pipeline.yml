---
name: CI pipeline

# Runs the PR's code, including from forks, so this workflow gets no secrets and a
# read-only token. The dbt Cloud integration test lives in integration_pipeline.yml.
on:
  pull_request:
      branches:
          - main

permissions:
    contents: read

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                fetch-depth: "0"
                persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

            - name: Set up Python
              run: uv python install

            - name: Install dependencies
              run: make install

            - name: Run pre-commit
              run: |
                git diff --name-only --diff-filter=d origin/main...HEAD > changed_files.txt
                cat changed_files.txt
                cat changed_files.txt | xargs --no-run-if-empty uv run pre-commit run --files

    unit-tests:
      needs: [pre-commit]
      runs-on: ubuntu-latest
      permissions:
          contents: read
          pull-requests: write
      steps:
          - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
            with:
              persist-credentials: false

          - name: Install uv
            uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

          - name: Set up Python
            run: uv python install

          - name: Install dependencies
            run: make install

          - name: Run pytest (unit tests)
            run: make test | tee pytest-coverage.txt && exit ${PIPESTATUS[0]}

          # Fork PRs get a read-only token, so they cannot post the comment.
          - name: Pytest coverage comment
            if: github.event.pull_request.head.repo.full_name == github.repository
            uses: MishaKav/pytest-coverage-comment@9ee59af31bd7bcada1cc496f086b407122602dbd # v1.12.3
            with:
                pytest-coverage-path: ./pytest-coverage.txt
                title: Coverage Report
                badge-title: Coverage
                junitxml-path: ./coverage.xml
