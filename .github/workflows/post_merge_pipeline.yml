---
name: Post-merge pipeline

on:
    push:
        branches:
            - main

# Pushes and PR operations use PAT_GITHUB, so GITHUB_TOKEN only needs to read.
permissions:
    contents: read

env:
    GH_TOKEN: ${{ secrets.PAT_GITHUB }}

jobs:
    create-and-poll-new-pr:
        outputs:
          commit_sha: ${{ steps.commit.outputs.commit_long_sha }}
          pr_num: ${{ steps.poll-pr.outputs.PR_NUM }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                    token: ${{ secrets.PAT_GITHUB }}

            - name: Dummy changes to force pipeline to detect some predicatable changes
              run: touch ./test.txt

            - name: Delete remote `test-action` branch
              run: git push origin --delete test-action || true

            - id: commit
              uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4
              with:
                    author_name: github-actions[bot]
                    author_email: bot@github.com
                    new_branch: test-action
                    push: --force --set-upstream origin test-action

            - name: Create Pull Request
              id: create-ci-pr
              run: |
                    export PR_URL=$(gh pr create -B main -H test-action --title 'DO NOT MERGE: Auto-generated PR to run checks for commit ${{ github.sha }}' --body 'Do not merge this PR')
                    echo "PR_URL=$PR_URL" >> $GITHUB_OUTPUT

            - name: Poll checks of triggered PR
              id: poll-pr
              env:
                PR_URL: ${{ steps.create-ci-pr.outputs.PR_URL }}
              run: |
                    sleep 10 # Need to wait for PR to be initialised
                    export PR_NUM=$(echo "$PR_URL" | cut -d / -f 7)
                    echo $PR_NUM
                    echo "PR_NUM=$PR_NUM" >> $GITHUB_OUTPUT
                    gh pr checks $PR_NUM --fail-fast --watch

    close-new-pr:
        if: always()
        needs: [create-and-poll-new-pr]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Close PR
              env:
                PR_NUM: ${{ needs.create-and-poll-new-pr.outputs.pr_num }}
              run: gh pr close $PR_NUM

    # Checks the published action at `@main` against the dbt Cloud run of the test PR.
    download-artifacts:
        needs: [create-and-poll-new-pr]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            statuses: read
        steps:
          - name: Download dbt artifacts
            uses: pgoslatara/dbt-cloud-download-artifacts-action@main
            with:
              commit-sha: ${{ needs.create-and-poll-new-pr.outputs.commit_sha }}
              dbt-cloud-api-token: ${{ secrets.DBT_CLOUD_API_TOKEN }}
              output-dir: target
              step: 4
              verbose: true
