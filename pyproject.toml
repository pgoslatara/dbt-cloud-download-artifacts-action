[project]
authors = [
    {name = "Padraic Slattery", email = "pgoslatara@gmail.com"}
]
dependencies = [
    "requests>=2.32.3",
    "tenacity>=9.0.0",
]
description = "GitHub Action to download artifacts from a dbt Cloud CI job."
license = {"text" = "MIT License"}
name = "dbt-cloud-download-artifacts-action"
readme = "README.md"
requires-python = ">=3.11"
version = "1.1.3"

[project.optional-dependencies]
dev = [
    "mypy<3",
    "pre-commit<5",
    "pytest<10",
    "pytest-cov<8",
    "pytest-xdist<4",
    "responses<1",
    "ruff<1",
    "semver<4",
    "sqlfmt<1",
    "types-requests",
]

[project.scripts]
download_artifacts = "dbt_cloud_download_artifacts_action.main:cli"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
explicit_package_bases = true
follow_imports = "silent"
mypy_path = "src"
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
indent-width = 4
line-length = 88
target-version = "py311"

[tool.ruff.format]
docstring-code-format = false
docstring-code-line-length = "dynamic"
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
ignore = ["missing-trailing-comma", "undocumented-public-module", "incorrect-blank-line-before-class", "multi-line-summary-second-line", "missing-new-line-after-section-name", "missing-dashed-underline-after-section", "mismatched-section-underline-length", "line-too-long", "logging-f-string", "assert"]
preview = true
select = ["A", "ARG", "B", "C4", "COM", "D", "DOC", "E", "EXE", "F", "G", "I", "ICN", "LOG", "N", "PT", "PTH", "Q", "RUF", "S", "SIM", "T20", "TCH", "TID", "W"]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["module-import-not-at-top-of-file"]
"tests/*" = ["undocumented-public-module", "undocumented-public-function", "undocumented-public-package", "missing-trailing-period", "missing-terminal-punctuation", "module-import-not-at-top-of-file"]

[tool.uv]
# Install the project itself so `uv run` exposes the `download_artifacts` script.
package = true
