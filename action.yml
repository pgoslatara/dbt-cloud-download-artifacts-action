name: 'dbt-cloud-download-artifacts-action'
description: 'Download artifacts from a dbt Cloud CI job.'
inputs:
  artifacts:
    default: ""
    description: 'Comma-separated list of artifact names to download (e.g. "manifest.json,run_results.json"). Default downloads all JSON artifacts.'
    required: false
  commit-sha:
    description: 'SHA of the commit that triggered the dbt Cloud CI job.'
    required: true
  dbt-cloud-api-token:
    description: 'dbt Cloud API token.'
    required: true
  dbt-cloud-api-url-base:
    default: ""
    description: 'Base URL of the dbt Cloud API. Defaults to auto-detect from commit status URL or cloud.getdbt.com.'
    required: false
  fail-on-run-failure:
    default: 'false'
    description: 'Fail the action if the dbt Cloud CI job did not succeed.'
    required: false
  job-timeout:
    default: '1800'
    description: 'Maximum seconds to wait for the dbt Cloud job run to complete.'
    required: false
  output-dir:
    default: '.'
    description: 'Directory where the artifacts will be saved.'
    required: false
  overwrite:
    default: 'false'
    description: 'Overwrite existing artifact files if they already exist.'
    required: false
  repo-name:
    default: '${{ github.repository }}'
    description: 'Name of the repository.'
    required: false
  step:
    default: ""
    description: 'The index of the Step in the Run to query for artifacts.'
    required: false
  verbose:
    default: 'false'
    description: Run dbt-cloud-download-artifacts-action in verbose mode.
    required: false
  wait-timeout:
    default: '120'
    description: 'Maximum seconds to wait for dbt Cloud CI commit status.'
    required: false

outputs:
  account-id:
    description: 'dbt Cloud account ID.'
    value: ${{ steps.download.outputs.account-id }}
  artifacts:
    description: 'Comma-separated paths to downloaded artifacts.'
    value: ${{ steps.download.outputs.artifacts }}
  run-id:
    description: 'dbt Cloud run ID.'
    value: ${{ steps.download.outputs.run-id }}
  run-status:
    description: 'Status of the dbt Cloud run (success or failure).'
    value: ${{ steps.download.outputs.run-status }}

runs:
  using: composite

  # Run from the caller's workspace so a relative `output-dir` resolves against it, but
  # load the project from the action's own directory. `actions/checkout` must not be
  # used here: inside a composite action it checks out the caller's repo.
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

    - id: download
      name: Download artifacts
      env:
        ARTIFACTS: ${{ inputs.artifacts }}
        COMMIT_SHA: ${{ inputs.commit-sha }}
        DBT_CLOUD_API_TOKEN: ${{ inputs.dbt-cloud-api-token }}
        DBT_CLOUD_API_URL_BASE: ${{ inputs.dbt-cloud-api-url-base }}
        FAIL_ON_RUN_FAILURE: ${{ inputs.fail-on-run-failure }}
        JOB_TIMEOUT: ${{ inputs.job-timeout }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        OVERWRITE: ${{ inputs.overwrite }}
        PAT_GITHUB: ${{ github.token }}
        REPO_NAME: ${{ inputs.repo-name }}
        STEP: ${{ inputs.step }}
        VERBOSE: ${{ inputs.verbose }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
      shell: bash
      run: |
        args=(--commit-sha "$COMMIT_SHA" --output-dir "$OUTPUT_DIR" --repo-name "$REPO_NAME")
        if [[ -n "$ARTIFACTS" ]]; then
          args+=(--artifacts "$ARTIFACTS")
        fi
        if [[ -n "$DBT_CLOUD_API_URL_BASE" ]]; then
          args+=(--dbt-cloud-api-url-base "$DBT_CLOUD_API_URL_BASE")
        fi
        if [[ "$FAIL_ON_RUN_FAILURE" == "true" ]]; then
          args+=(--fail-on-run-failure)
        fi
        if [[ -n "$JOB_TIMEOUT" ]]; then
          args+=(--job-timeout "$JOB_TIMEOUT")
        fi
        if [[ "$OVERWRITE" == "true" ]]; then
          args+=(--overwrite)
        fi
        if [[ -n "$STEP" ]]; then
          args+=(--step "$STEP")
        fi
        if [[ "$VERBOSE" != "false" ]]; then
          args+=(--verbose)
        fi
        if [[ -n "$WAIT_TIMEOUT" ]]; then
          args+=(--wait-timeout "$WAIT_TIMEOUT")
        fi
        uv run --project "$GITHUB_ACTION_PATH" --locked download_artifacts "${args[@]}"
